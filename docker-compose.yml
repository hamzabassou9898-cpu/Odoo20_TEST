services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_DB=postgres
    volumes:
      - odoo-db:/var/lib/postgresql/data

  odoo:
    image: odoo:20
    depends_on:
      - db
    ports:
      - "8070:8069"
    command: odoo --http-interface=0.0.0.0
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      - odoo-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons

volumes:
  odoo-db:
  odoo-data:
